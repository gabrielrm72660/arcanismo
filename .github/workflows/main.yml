name: Compilar mod

on:
  push:
    paths-ignore:
      - probe-classes.txt
      - probe-bytecode.txt
      - .github/workflows/probe.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  MC_VERSION: "26.1"
  FORGE_VERSION: "62.0.9"

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Baixar o MDK do Forge
        run: |
          URL="https://maven.minecraftforge.net/net/minecraftforge/forge/${MC_VERSION}-${FORGE_VERSION}/forge-${MC_VERSION}-${FORGE_VERSION}-mdk.zip"
          echo "Baixando $URL"
          curl -fL "$URL" -o mdk.zip
          unzip -q mdk.zip -d mdk

      - name: Colocar o código do mod dentro do MDK
        run: |
          rm -rf mdk/src/main/java
          cp -r src/. mdk/src/
          cd mdk
          definir() {
            if grep -q "^$1=" gradle.properties; then
              sed -i "s|^$1=.*|$1=$2|" gradle.properties
            else
              echo "$1=$2" >> gradle.properties
            fi
          }
          definir mod_id navegantes
          definir mod_name Navegantes
          definir mod_version 0.1.0
          definir mod_group_id br.navegantes
          definir mod_authors Navegantes
          definir mod_description "Navios de verdade: cole a estrutura, coloque o timão e navegue."
          definir mod_license "All Rights Reserved"

      - name: Compilar
        id: build
        continue-on-error: true
        working-directory: mdk
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee ../build.log

      - name: Publicar o log de erros (branch ci-logs)
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p logs
          grep -B1 -A4 -E "error:|FAILED|What went wrong" build.log > logs/erros.txt || true
          tail -n 300 build.log > logs/build-tail.log
          cd logs
          git init -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "log da compilacao"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:ci-logs

      - name: Falhar se a compilação falhou
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Disponibilizar o .jar para download
        uses: actions/upload-artifact@v4
        with:
          name: navegantes-jar
          path: |
            mdk/build/libs/*.jar
            !mdk/build/libs/*-sources.jar
